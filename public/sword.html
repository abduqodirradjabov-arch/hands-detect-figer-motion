<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qilich</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #e8ecf5; }
  video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; transform: scaleX(-1); filter: brightness(0.45) saturate(0.8); }
  #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    font-size: 18px; padding: 24px; pointer-events: none; text-shadow: 0 1px 12px #000; transition: opacity .4s; }
  #hud { position: fixed; left: 20px; bottom: 18px; font-size: 13px; opacity: .75; text-shadow: 0 1px 6px #000; }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="fx"></canvas>
<div id="status">Model va kamera yuklanmoqda…</div>
<div id="hud">Qo'lingizni musht qiling: qilich chiqadi. Rangni almashtirish: ekranga bosing.</div>
<script type="module">
const video = document.getElementById('cam');
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const DEMO = new URLSearchParams(location.search).has('demo');

const PALETTES = [
  ['#18b6ff', '#ff2a5d'], // ko'k + qizil
  ['#39ff6a', '#b84dff'], // yashil + binafsha
  ['#ffd21a', '#ff6a00'], // sariq + to'q sariq
  ['#00ffe0', '#ff4df0'], // firuza + pushti
];
let palette = 0;
addEventListener('pointerdown', () => { palette = (palette + 1) % PALETTES.length; });

let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

// --- landmark -> ekran koordinatasi (video "cover" + ko'zgu) -------------------
function toScreen(p) {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(W / vw, H / vh);
  const ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  return { x: W - (ox + p.x * vw * s), y: oy + p.y * vh * s };
}

// --- musht aniqlash ------------------------------------------------------------
const TIPS = [8, 12, 16, 20], MCPS = [5, 9, 13, 17];
const d3 = (a, b) => Math.hypot(a.x - b.x, (a.y - b.y) * (video.videoHeight / video.videoWidth || 0.5625), a.z - b.z);
function curlRatio(lm) {
  let sum = 0;
  for (let i = 0; i < 4; i++) sum += d3(lm[TIPS[i]], lm[0]) / d3(lm[MCPS[i]], lm[0]);
  return sum / 4; // musht ~ 1.0 yoki kam, ochiq qo'l ~ 1.8+
}

// --- qo'llar holati ------------------------------------------------------------
const hands = new Map(); // key -> holat
function update(key, wrist, mid, fistRaw, dt, now) {
  let h = hands.get(key);
  if (!h) {
    h = { wrist: { ...wrist }, mid: { ...mid }, fist: false, len: 0, seen: now, flick: Math.random() * 10 };
    hands.set(key, h);
  }
  const k = 1 - Math.exp(-dt * 28);
  h.wrist.x += (wrist.x - h.wrist.x) * k; h.wrist.y += (wrist.y - h.wrist.y) * k;
  h.mid.x += (mid.x - h.mid.x) * k; h.mid.y += (mid.y - h.mid.y) * k;
  h.fist = fistRaw;
  h.seen = now;
}

function drawHand(key, h, dt, t, color) {
  const dx = h.mid.x - h.wrist.x, dy = h.mid.y - h.wrist.y;
  const palm = Math.hypot(dx, dy) || 1;
  const ux = dx / palm, uy = dy / palm;
  const target = h.fist ? Math.min(palm * 4.6, Math.max(W, H) * 0.7) : 0;
  h.len += (target - h.len) * Math.min(1, dt * (h.fist ? 9 : 14));
  if (h.len < 2) return;

  const bx = h.mid.x + ux * palm * 0.1, by = h.mid.y + uy * palm * 0.1; // pichoq asosi
  const tx = bx + ux * h.len, ty = by + uy * h.len;
  const flicker = 0.92 + 0.08 * Math.sin(t * 38 + h.flick) + 0.03 * Math.sin(t * 91);
  const w = Math.max(6, palm * 0.17) * flicker;

  // dasta (tutqich)
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'round';
  const hx = h.wrist.x + ux * palm * 0.25, hy = h.wrist.y + uy * palm * 0.25;
  ctx.strokeStyle = '#2a2d36'; ctx.lineWidth = w * 1.15;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = '#8b93a7'; ctx.lineWidth = w * 0.35;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(bx, by); ctx.stroke();
  // himoya (guard)
  const nx = -uy, ny = ux;
  ctx.strokeStyle = '#aab2c5'; ctx.lineWidth = w * 0.45;
  ctx.beginPath(); ctx.moveTo(bx + nx * w * 1.3, by + ny * w * 1.3); ctx.lineTo(bx - nx * w * 1.3, by - ny * w * 1.3); ctx.stroke();

  // yorug' pichoq (qatlam-qatlam, additive)
  ctx.globalCompositeOperation = 'lighter';
  const layers = [[5.2, 0.07], [3.2, 0.14], [1.9, 0.32], [1.1, 0.7]];
  ctx.shadowColor = color; ctx.shadowBlur = 28;
  for (const [m, a] of layers) {
    ctx.globalAlpha = a * flicker; ctx.strokeStyle = color; ctx.lineWidth = w * m;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
  }
  ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
  ctx.globalAlpha = 0.95; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = w * 0.5;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.restore();
}

// --- asosiy sikl ---------------------------------------------------------------
let last = performance.now();
let source = () => []; // har kadrda [{key, wrist, mid, fistRaw}] qaytaradi

function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  const t = nowMs / 1000;
  ctx.clearRect(0, 0, W, H);
  for (const hd of source(nowMs)) update(hd.key, hd.wrist, hd.mid, hd.fistRaw, dt, nowMs);
  let n = 0, fists = 0;
  for (const [key, h] of hands) {
    const lost = nowMs - h.seen > 250;
    if (lost) h.fist = false;
    if (lost && h.len < 2) { hands.delete(key); continue; }
    const idx = key === 'B' || key === 'Right' ? 1 : 0;
    drawHand(key, h, dt, t, PALETTES[palette][idx]);
    if (!lost) n++;
    if (h.fist && !lost) fists++;
  }
  document.getElementById('hud').textContent =
    `Qo'llar: ${n} · Qilichlar: ${fists} · Qo'lingizni musht qiling. Rangni almashtirish: ekranga bosing.`;
  requestAnimationFrame(frame);
}

// --- demo rejimi (kamerasiz) ----------------------------------------------------
if (DEMO) {
  statusEl.style.opacity = 0;
  document.body.style.background = 'radial-gradient(circle at 50% 40%, #1a2238, #05060a)';
  source = (ms) => {
    const t = ms / 1000;
    const a = { x: W * 0.3 + Math.sin(t * 0.9) * 40, y: H * 0.72 };
    const b = { x: W * 0.7 + Math.sin(t * 0.7 + 1) * 40, y: H * 0.72 };
    const fa = true, fb = Math.sin(t * 0.6) > -0.4;
    const rot = (p, ang, len) => ({ x: p.x + Math.sin(ang) * len, y: p.y - Math.cos(ang) * len });
    const angA = -0.35 + Math.sin(t * 1.3) * 0.25, angB = 0.35 + Math.sin(t * 1.1 + 2) * 0.25;
    return [
      { key: 'A', wrist: a, mid: rot(a, angA, 110), fistRaw: fa },
      { key: 'B', wrist: b, mid: rot(b, angB, 110), fistRaw: fb },
    ];
  };
  requestAnimationFrame(frame);
} else {
  start();
}

async function start() {
  try {
    const { FilesetResolver, HandLandmarker } = await import(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fileset = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = (delegate) => ({
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate,
      },
      runningMode: 'VIDEO', numHands: 2,
    });
    let landmarker;
    try { landmarker = await HandLandmarker.createFromOptions(fileset, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(fileset, opts('CPU')); }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream;
    await video.play();
    statusEl.style.opacity = 0;

    const fistState = new Map();
    let lastVideoTime = -1, cache = [];
    source = (ms) => {
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const res = landmarker.detectForVideo(video, ms);
        cache = res.landmarks.map((lm, i) => {
          const key = res.handedness?.[i]?.[0]?.categoryName || String(i);
          const r = curlRatio(lm);
          const was = fistState.get(key) || false;
          const fist = was ? r < 1.5 : r < 1.25; // gisterezis: titramasin
          fistState.set(key, fist);
          return { key, wrist: toScreen(lm[0]), mid: toScreen(lm[9]), fistRaw: fist };
        });
      }
      return cache;
    };
    requestAnimationFrame(frame);
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Ishga tushmadi: ' + (e && e.message ? e.message : e) +
      '. Kameraga ruxsat bering yoki /sword.html?demo ni sinab ko\'ring.';
  }
}
</script>
</body>
</html>
