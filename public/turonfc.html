<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Turon FC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Maket: telefon kengligidagi ustun. Tepada hisob, o‘rtada sahifa, pastda 5 tugmali navigatsiya.
   Ranglar: tungi binafsha fon, yashil-turkuaz (mint) asosiy rang, oltin va pushti urg‘u. Bitta qorong‘i uslub. */
:root {
  color-scheme: dark;
  --bg: #0a0820; --bg2: #1d1050; --panel: rgba(255,255,255,.07); --panel2: rgba(255,255,255,.13); --line: rgba(255,255,255,.15);
  --ink: #f5f3ff; --muted: #aaa5d8; --mint: #25f0b0; --gold: #ffc93c; --hot: #ff3d85; --blue: #3ea8ff; --violet: #8a5cff;
  --disp: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 60%) fixed, var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.35; overflow: hidden; user-select: none; -webkit-user-select: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, .disp { font-family: var(--disp); text-transform: uppercase; letter-spacing: .03em; margin: 0; font-weight: 800; }
#app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }

/* ---------- yuqori panel ---------- */
.top { display: flex; align-items: center; gap: 10px; padding: 10px 0 8px; }
.crest { width: 38px; height: 42px; flex: none; }
.crest svg { width: 100%; height: 100%; display: block; }
.who { min-width: 0; flex: 1 1 0; display: flex; flex-direction: column; line-height: 1.1; }
.who b { font-family: var(--disp); font-size: 17px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 11.5px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; gap: 5px; align-items: center; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 4px 8px; font-family: var(--disp); font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.chip i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.chip.coin i { background: radial-gradient(circle at 35% 30%, #fff3b0, var(--gold) 55%, #b07a00); }
.chip.gem i { background: linear-gradient(135deg, #9bf2ff, var(--blue) 55%, #7a4dff); border-radius: 3px; transform: rotate(45deg) scale(.8); }
.ibtn { width: 32px; height: 32px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }

/* ---------- sahifalar ---------- */
.stage { flex: 1; position: relative; min-height: 0; }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 0 18px; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.screen.off { display: none; }
.screen.enter { animation: enter .38s cubic-bezier(.2,.8,.2,1) both; }
@keyframes enter { from { opacity: 0; transform: translateX(26px) scale(.985); } to { opacity: 1; transform: none; } }
.stack { display: flex; flex-direction: column; gap: 14px; }
.h-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.h-row h2 { font-size: 26px; }
.h-row small { color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--disp); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .05em; padding: 12px 22px; border-radius: 14px; color: #06281c; background: linear-gradient(180deg, #6bffd0, var(--mint) 60%, #0fc88a); box-shadow: 0 6px 0 #0a8f63, 0 12px 24px rgba(37,240,176,.28); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0a8f63, 0 6px 14px rgba(37,240,176,.25); }
.btn.gold { color: #3a2500; background: linear-gradient(180deg, #ffe88a, var(--gold) 60%, #e0a010); box-shadow: 0 6px 0 #a87400, 0 12px 24px rgba(255,201,60,.28); }
.btn.hot { color: #fff; background: linear-gradient(180deg, #ff7bb0, var(--hot) 60%, #d41f64); box-shadow: 0 6px 0 #961847, 0 12px 24px rgba(255,61,133,.28); }
.btn.ghost { color: var(--ink); background: var(--panel2); box-shadow: none; border: 1px solid var(--line); font-size: 17px; padding: 9px 16px; }
.btn.small { font-size: 16px; padding: 8px 14px; }
.btn.wide { width: 100%; }
.btn[disabled] { filter: grayscale(.9) brightness(.7); box-shadow: none; pointer-events: none; }

/* ---------- navigatsiya ---------- */
.nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 8px 0 10px; border-top: 1px solid var(--line); background: linear-gradient(180deg, transparent, rgba(0,0,0,.25)); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-family: var(--disp); font-weight: 700; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; position: relative; }
.nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--mint); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: -9px; width: 34px; height: 3px; border-radius: 3px; background: var(--mint); box-shadow: 0 0 14px var(--mint); }
.nav .play { color: #06281c; }
.nav .play span.pb { width: 54px; height: 54px; margin-top: -22px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(180deg, #6bffd0, var(--mint)); box-shadow: 0 0 0 5px var(--bg), 0 8px 22px rgba(37,240,176,.5); }
.nav .play svg { stroke: #06281c; fill: #06281c; }
.nav .play em { font-style: normal; color: var(--mint); }
.dot { position: absolute; top: 2px; right: 22%; width: 9px; height: 9px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 0 2px var(--bg); }

/* ---------- kirish (splash) ---------- */
#s-splash { position: fixed; inset: 0; z-index: 30; background: radial-gradient(90% 60% at 50% 38%, #3b1a9c, #150a3d 55%, #07051a); display: grid; place-items: center; overflow: hidden; padding: 0; border-radius: 0; }
#s-splash.off { display: none; }
.beams { position: absolute; inset: -40%; background: conic-gradient(from 0deg at 50% 50%, transparent 0 8%, rgba(255,201,60,.16) 10%, transparent 13% 30%, rgba(37,240,176,.15) 32%, transparent 35% 55%, rgba(255,61,133,.15) 57%, transparent 60% 80%, rgba(62,168,255,.16) 82%, transparent 85%); animation: spin 22s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.confetti-bg { position: absolute; inset: 0; pointer-events: none; }
.confetti-bg i { position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px; opacity: .85; animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.logo { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.logo .word { display: flex; gap: 2px; font-family: var(--disp); font-weight: 800; font-size: clamp(64px, 20vw, 104px); line-height: .9; letter-spacing: .02em; }
.logo .word span { display: inline-block; opacity: 0; transform: translateY(40px) scale(.6) rotate(-8deg); animation: pop .7s cubic-bezier(.2,1.4,.3,1) forwards; background: linear-gradient(180deg, #fff6c4, var(--gold) 45%, #e08a00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #6b3d00) drop-shadow(0 0 18px rgba(255,201,60,.55)); }
@keyframes pop { to { opacity: 1; transform: none; } }
.logo .fc { font-family: var(--disp); font-weight: 800; font-size: 34px; letter-spacing: .3em; padding: 2px 18px 2px 24px; border-radius: 10px; background: linear-gradient(90deg, var(--hot), var(--violet)); color: #fff; opacity: 0; animation: pop .6s .9s both; box-shadow: 0 0 28px rgba(255,61,133,.6); }
.logo .tag { color: #d9d3ff; letter-spacing: .28em; text-transform: uppercase; font-size: 12px; font-weight: 600; opacity: 0; animation: pop .6s 1.25s forwards; }
.shine { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%); mix-blend-mode: overlay; transform: translateX(-120%); animation: sweep 1.2s 1.6s ease forwards; pointer-events: none; }
@keyframes sweep { to { transform: translateX(120%); } }
.rollball { position: absolute; bottom: 21%; left: -80px; width: 64px; height: 64px; z-index: 3; animation: roll 2.2s .2s cubic-bezier(.3,.6,.3,1) forwards; }
@keyframes roll { 0% { left: -80px; transform: rotate(0); } 100% { left: calc(100% + 80px); transform: rotate(900deg); } }
.loadbox { position: absolute; left: 12%; right: 12%; bottom: 11%; z-index: 4; text-align: center; }
.bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--mint), var(--blue), var(--hot)); transition: width .25s linear; }
.loadtxt { margin-top: 8px; font-size: 13px; color: #cfc9ff; letter-spacing: .06em; min-height: 18px; }
.startbtn { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); z-index: 5; font-size: 26px; padding: 14px 38px; animation: bounce 1.2s ease-in-out infinite; }
@keyframes bounce { 50% { transform: translateX(-50%) translateY(-6px) scale(1.04); } }

/* ---------- bosh sahifa ---------- */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 16px; background: linear-gradient(135deg, #3a1ca8, #7a2bd0 55%, #ff3d85); border: 1px solid rgba(255,255,255,.25); box-shadow: 0 14px 34px rgba(90,40,200,.45); }
.hero::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.06) 0 14px, transparent 14px 28px); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; margin: 8px 0 14px; }
.vs .t { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--disp); font-weight: 700; font-size: 17px; text-transform: uppercase; line-height: 1.05; min-width: 0; }
.vs .t b { font-size: 30px; color: var(--gold); line-height: 1; }
.vs .x { font-family: var(--disp); font-weight: 800; font-size: 28px; opacity: .8; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; text-align: left; padding: 14px; border-radius: 18px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; border: 1px solid rgba(255,255,255,.2); transition: transform .12s; }
.tile:active { transform: scale(.97); }
.tile h3 { font-size: 24px; }
.tile small { font-size: 13px; opacity: .9; font-weight: 500; }
.tile.a { background: linear-gradient(135deg, #0e8f7a, #25f0b0 140%); color: #032a1f; }
.tile.b { background: linear-gradient(135deg, #b8860b, #ffc93c 140%); color: #2d1d00; }
.tile.c { background: linear-gradient(135deg, #1b50c8, #3ea8ff 140%); color: #031a3a; }
.tile.d { background: linear-gradient(135deg, #b0124f, #ff3d85 140%); color: #3a0016; }
.tile .big { position: absolute; right: -10px; bottom: -14px; font-family: var(--disp); font-weight: 800; font-size: 78px; opacity: .22; line-height: 1; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats3 b { display: block; font-family: var(--disp); font-size: 30px; line-height: 1; }
.stats3 span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; }
.sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 3px var(--mint); }
.input { width: 100%; font: inherit; font-family: var(--disp); font-size: 20px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink); background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; user-select: text; -webkit-user-select: text; }

/* ---------- kartalar ---------- */
/* Barcha o'lchamlar --u (karta birligi) orqali: yozuvlar bir-biriga siljimaydi */
.pcard { --u: 16px; --c1: #ffe27a; --c2: #d19a14; --ink2: #2e2000; font-size: var(--u); width: calc(var(--u) * 8.2); height: calc(var(--u) * 11.6); position: relative; border-radius: var(--u) calc(var(--u) * .7) var(--u) calc(var(--u) * .7); background: linear-gradient(155deg, var(--c1), var(--c2)); color: var(--ink2); box-shadow: 0 calc(var(--u) * .5) calc(var(--u) * 1.2) rgba(0,0,0,.45), inset 0 0 0 calc(var(--u) * .14) rgba(255,255,255,.35); overflow: hidden; flex: none; text-align: left; }
.pcard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 20% 0%, rgba(255,255,255,.55), transparent 60%), repeating-linear-gradient(115deg, rgba(255,255,255,.14) 0 calc(var(--u) * .5), transparent calc(var(--u) * .5) var(--u)); pointer-events: none; }
.pcard .ovr { position: absolute; left: calc(var(--u) * .55); top: calc(var(--u) * .3); font-family: var(--disp); font-weight: 800; font-size: calc(var(--u) * 2.2); line-height: 1; }
.pcard .pos { position: absolute; left: calc(var(--u) * .7); top: calc(var(--u) * 2.55); font-family: var(--disp); font-weight: 700; font-size: var(--u); line-height: 1; letter-spacing: .06em; }
.pcard .nat { position: absolute; left: calc(var(--u) * .6); top: calc(var(--u) * 3.9); font-size: calc(var(--u) * .7); line-height: 1; font-weight: 700; padding: calc(var(--u) * .15) calc(var(--u) * .4); border-radius: calc(var(--u) * .4); background: rgba(0,0,0,.18); }
.pcard .av { position: absolute; right: calc(var(--u) * .2); top: calc(var(--u) * .5); width: calc(var(--u) * 5.6); height: calc(var(--u) * 5.6); }
.pcard .av svg { width: 100%; height: 100%; display: block; }
.pcard .nm { position: absolute; left: 0; right: 0; top: calc(var(--u) * 6.5); text-align: center; font-family: var(--disp); font-weight: 800; font-size: calc(var(--u) * 1.15); line-height: 1.15; text-transform: uppercase; letter-spacing: .03em; padding: 0 calc(var(--u) * .3) calc(var(--u) * .2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: calc(var(--u) * .1) solid rgba(0,0,0,.22); }
.pcard .st { position: absolute; left: calc(var(--u) * .35); right: calc(var(--u) * .35); top: calc(var(--u) * 8.55); display: grid; grid-template-columns: repeat(5, 1fr); gap: calc(var(--u) * .1); text-align: center; font-family: var(--disp); font-weight: 700; line-height: 1.05; }
.pcard .st b { display: block; font-size: calc(var(--u) * 1.05); }
.pcard .st span { display: block; font-size: calc(var(--u) * .62); opacity: .75; letter-spacing: .04em; }
.pcard.r-bronze { --c1: #e8ad7e; --c2: #8a5430; --ink2: #2b1608; }
.pcard.r-silver { --c1: #f2f5fd; --c2: #8d98b3; --ink2: #1c2235; }
.pcard.r-gold { --c1: #ffe27a; --c2: #d19a14; --ink2: #2e2000; }
.pcard.r-elite { --c1: #e29bff; --c2: #3b17b0; --ink2: #ffffff; box-shadow: 0 0 calc(var(--u) * 1.4) rgba(180,76,255,.75), 0 calc(var(--u) * .5) calc(var(--u) * 1.2) rgba(0,0,0,.45), inset 0 0 0 calc(var(--u) * .14) rgba(120,240,255,.7); }
.pcard.r-elite::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.5) 50%, transparent 62%); transform: translateX(-130%); animation: sweep 2.6s 0s ease-in-out infinite; pointer-events: none; }
.pcard.mini { --u: 8.4px; }
.pcard.mini .st, .pcard.mini .nat { display: none; }
.pcard.mini .av { width: calc(var(--u) * 4.8); height: calc(var(--u) * 4.8); top: calc(var(--u) * .6); right: calc(var(--u) * -.2); }
.pcard.mini .nm { top: calc(var(--u) * 6.7); }
.pcard.big { --u: 22px; }
.pcard.empty { background: rgba(255,255,255,.08); box-shadow: none; border: 2px dashed rgba(255,255,255,.3); color: var(--muted); display: grid; place-items: center; font-family: var(--disp); }
.pcard.empty::before { display: none; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 12px 8px; justify-items: center; }
.grid-cards .pcard { --u: 11.5px; }

/* ---------- jamoa (maydon) ---------- */
.rate { display: flex; align-items: center; gap: 14px; }
.rate .n { font-family: var(--disp); font-weight: 800; font-size: 56px; line-height: .9; color: var(--gold); text-shadow: 0 0 18px rgba(255,201,60,.4); }
.rate .bars { flex: 1; display: grid; gap: 6px; }
.rate .b { display: grid; grid-template-columns: 38px 1fr 28px; gap: 8px; align-items: center; font-family: var(--disp); font-weight: 700; font-size: 14px; color: var(--muted); }
.rate .b i { display: block; height: 7px; border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; }
.rate .b i s { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--mint), var(--blue)); }
.rate .b em { font-style: normal; color: var(--ink); text-align: right; }
.pitch { position: relative; width: 100%; aspect-ratio: 5 / 6.7; border-radius: 18px; overflow: hidden; background: repeating-linear-gradient(0deg, #1c8a43 0 12.5%, #20a04e 12.5% 25%); border: 2px solid rgba(255,255,255,.55); box-shadow: 0 14px 30px rgba(0,0,0,.4); }
.pitch .ln { position: absolute; border: 2px solid rgba(255,255,255,.55); pointer-events: none; }
.pitch .mid { left: 0; right: 0; top: 50%; height: 0; border-width: 2px 0 0; }
.pitch .cc { left: 50%; top: 50%; width: 26%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }
.pitch .bx1 { left: 22%; right: 22%; top: 0; height: 15%; border-top: 0; }
.pitch .bx2 { left: 22%; right: 22%; bottom: 0; height: 15%; border-bottom: 0; }
.slot { position: absolute; transform: translate(-50%, -50%); }
.slot .pcard { transition: transform .12s; }
.slot:active .pcard { transform: scale(.94); }
.slot .lab { position: absolute; left: 50%; bottom: -1.2em; transform: translateX(-50%); font-family: var(--disp); font-weight: 700; font-size: 10px; letter-spacing: .08em; color: #fff; text-shadow: 0 1px 3px #000; }
.slot.fresh .pcard { animation: drop .5s cubic-bezier(.2,1.4,.3,1); }
@keyframes drop { from { transform: translateY(-30px) scale(1.3); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- oyna (modal / sheet) ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(5,3,20,.72); backdrop-filter: blur(5px); animation: fade .2s ease both; padding: 0; }
.overlay.center { align-items: center; padding: 16px; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(480px, 100%); max-height: 86%; overflow-y: auto; background: linear-gradient(180deg, #281a68, #130a38); border: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 16px 16px 24px; animation: up .28s cubic-bezier(.2,.9,.2,1) both; }
@keyframes up { from { transform: translateY(60px); opacity: 0; } }
.sheet.mid { border-radius: 24px; max-width: 420px; }
.sheet h3 { font-size: 26px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); text-align: left; width: 100%; margin-bottom: 8px; }
.row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; font-family: var(--disp); text-transform: uppercase; font-weight: 700; font-size: 17px; letter-spacing: .03em; line-height: 1.1; }
.row .info small { font-family: var(--body); text-transform: none; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.row.on { border-color: var(--mint); box-shadow: 0 0 0 1px var(--mint) inset; }
.tag { font-family: var(--disp); font-weight: 700; font-size: 13px; letter-spacing: .06em; padding: 2px 8px; border-radius: 8px; background: var(--panel2); color: var(--muted); text-transform: uppercase; }
.tag.good { background: rgba(37,240,176,.2); color: var(--mint); }
.detail { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.sbar { width: 100%; display: grid; gap: 7px; }
.sbar .b { display: grid; grid-template-columns: 54px 1fr 32px; gap: 8px; align-items: center; font-family: var(--disp); font-weight: 700; letter-spacing: .05em; color: var(--muted); font-size: 15px; }
.sbar .b i { display: block; height: 9px; border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; }
.sbar .b s { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--mint), var(--gold)); }
.sbar .b em { font-style: normal; color: var(--ink); text-align: right; }

/* ---------- paketlar ---------- */

.flip { --u: 24px; position: relative; width: calc(var(--u) * 8.2); height: calc(var(--u) * 11.6); font-size: var(--u); transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.2,.4,1); }
.flip.done { transform: rotateY(180deg); }
.flip > * { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }

function schedule() {

/* ---------- boshqaruv: joystik, tugmalar, klaviatura ---------- */
(function bindControls() {

  const R = 54;
  const upd = (e) => {
    const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy);

    J.x = dx / R; J.y = dy / R; knob.style.transform = `translate(${dx}px,${dy}px)`;
  };
  joy.addEventListener('pointerdown', (e) => { pid = e.pointerId; joy.setPointerCapture(pid); upd(e); e.preventDefault(); });
  joy.addEventListener('pointermove', (e) => { if (e.pointerId === pid) upd(e); });
  const end = (e) => { if (e.pointerId === pid) { pid = null; J.x = J.y = 0; knob.style.transform = ''; } };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  const btn = (el, key) => {
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); K[key] = true; el.classList.add('down'); });
    const up = () => el.classList.remove('down');
    el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up); el.addEventListener('pointercancel', up);
  };
  btn($('#btnA'), 'shoot'); btn($('#btnB'), 'pass');
  const keys = new Set();
  const calc = () => { K.x = (keys.has('ArrowRight') || keys.has('d') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('a') ? 1 : 0); K.y = (keys.has('ArrowDown') || keys.has('s') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('w') ? 1 : 0); };
  addEventListener('keydown', (e) => {
    if (!M) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();
    if (k === ' ' || k === 'j') { if (!e.repeat) K.shoot = true; }
    else if (k === 'Shift' || k === 'k') { if (!e.repeat) K.pass = true; }

})();

function penShoot() {
  if (P.phase !== 'meter') return;
  const m = Math.sin((performance.now() - P.t0) / 1000 * 3.1);
  P.m = m; P.phase = 'shot'; $('#penShoot').disabled = true;
  const dev = Math.abs(m) < .1 ? m * .2 : m;
  const fx = P.tx + dev * 62 + rnd(-4, 4), fy = P.ty + Math.abs(dev) * rnd(-26, 14) + rnd(-4, 4);
  const zx = pick([105, 180, 255]), zy = pick([112, 160]);
  let out = fx < GL + 6 || fx > GR - 6 || fy < GT + 2 || fy > GB;
  let saved = false;
  if (!out) saved = Math.abs(fx - zx) < 54 && Math.abs(fy - zy) < 46;
  P.anim = { t: 0, fx, fy, zx, zy, out, saved }; sfx('kick');
}
function penFinish(r) {
  P.res.push(r === 'goal' ? 1 : 0); if (r === 'goal') P.goals++;
  P.msg = r === 'goal' ? 'GOL!' : r === 'save' ? 'SEYV!' : 'SIRTDAN!'; P.msgT = 1.3; P.net = r === 'goal' ? 1 : 0;
  sfx(r === 'goal' ? 'goal' : r === 'save' ? 'save' : 'lose'); penPips();
  P.n++; P.phase = 'result';
  setTimeout(() => {
    if (!P || P.done) return;
    if (P.n >= 5) { penEnd(); return; }
    P.phase = 'aim'; P.tx = P.ty = null; P.anim = null; P.msg = '';
  }, 1400);
}
function penEnd() {
  P.done = true; const coins = P.goals * 100 + (P.goals === 5 ? 500 : 0);
  C.gain(coins, P.goals === 5 ? 5 : 0); sfx(P.goals >= 3 ? 'win' : 'lose');
  C.openSheet(`<div class="resbox"><div class="verdict" style="color:${P.goals >= 3 ? 'var(--mint)' : 'var(--gold)'}">${P.goals}/5 gol</div>
    <div class="reward"><span class="chip coin"><i></i>+${C.fmt(coins)}</span>${P.goals === 5 ? '<span class="chip gem"><i></i>+5</span>' : ''}</div>
    <p style="margin:0;color:var(--muted)">${P.goals === 5 ? 'Mukammal seriya!' : 'Yana urib ko‘ring, mukofot gollarga qarab oshadi.'}</p>
    <div style="display:flex;gap:10px"><button class="btn ghost wide" data-go="home">Bosh sahifa</button><button class="btn wide" id="penAgain">Yana</button></div></div>`, { center: true, lock: true });
  $('#penAgain').addEventListener('click', () => { C.closeSheet(); C.RENDER.pen(); });
}
function penLoop() {
  const cv = $('#penCv'); if (!cv || !P || C.G() === null) return;
  let last = performance.now();
  const f = (ts) => {
    if (!$('#penCv') || !P) return; penRaf = requestAnimationFrame(f);
    const dt = Math.min(.05, (ts - last) / 1000); last = ts;
    if (P.phase === 'meter') { const m = Math.sin((performance.now() - P.t0) / 1000 * 3.1); $('#meterI').style.left = ((m + 1) / 2 * 100) + '%'; }
    else $('#meterI').style.left = '50%';
    $('#penHint').textContent = P.phase === 'aim' ? 'Darvoza ichiga bosib, nishonni tanlang' : P.phase === 'meter' ? 'Chiziq yashil joyda turganda “Zarba!” ni bosing' : '';
    if (P.anim && P.phase === 'shot') { P.anim.t += dt / .62; if (P.anim.t >= 1) { P.anim.t = 1; P.phase = 'result0'; penFinish(P.anim.out ? 'out' : P.anim.saved ? 'save' : 'goal'); } }
    if (P.msgT > 0) P.msgT -= dt; if (P.net > 0) P.net = Math.max(0, P.net - dt * .8);
    drawPen(cv.getContext('2d'));
  };
  penRaf = requestAnimationFrame(f);
}
function drawPen(x) {
  x.setTransform(2, 0, 0, 2, 0, 0);
  // tribuna
  const sky = x.createLinearGradient(0, 0, 0, 120); sky.addColorStop(0, '#2a1170'); sky.addColorStop(1, '#5a2bc0'); x.fillStyle = sky; x.fillRect(0, 0, PWD, 150);
  for (let i = 0; i < 160; i++) { x.fillStyle = ['#ffc93c', '#25f0b0', '#ff3d85', '#3ea8ff', '#fff'][i % 5]; x.globalAlpha = .55; x.fillRect((i * 37) % PWD, 4 + ((i * 13) % 52), 3, 3); }
  x.globalAlpha = 1;
  // maysa
  for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#1d9448' : '#22a553'; x.fillRect(0, 150 + i * 36, PWD, 37); }
  x.strokeStyle = 'rgba(255,255,255,.8)'; x.lineWidth = 2; x.strokeRect(20, 150, PWD - 40, 200); x.beginPath(); x.arc(180, 372, 3, 0, 7); x.fillStyle = '#fff'; x.fill();
  // darvoza ichi
  x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(GL, GT, GR - GL, GB - GT);
  x.strokeStyle = 'rgba(255,255,255,.28)'; x.lineWidth = 1;
  for (let i = GL; i <= GR; i += 12) { x.beginPath(); x.moveTo(i, GT); x.lineTo(i, GB); x.stroke(); }
  for (let j = GT; j <= GB; j += 10) { x.beginPath(); x.moveTo(GL, j); x.lineTo(GR, j); x.stroke(); }
  const a = P.anim;
  // darvozabon
  let gx = 180, gy = 168, rot = 0;
  if (a) { const k = Math.min(1, a.t * 1.6), e = 1 - Math.pow(1 - k, 3); gx = 180 + (a.zx - 180) * e; gy = 168 + (a.zy - 168) * e; rot = (a.zx - 180) / 75 * .9 * e; }
  else gx += Math.sin(performance.now() / 380) * 8;
  x.save(); x.translate(gx, gy); x.rotate(rot);
  x.fillStyle = '#ff7a2f'; x.strokeStyle = '#0006'; x.lineWidth = 2;
  x.beginPath(); x.roundRect(-16, -8, 32, 42, 8); x.fill(); x.stroke();
  x.fillStyle = '#ffd5a8'; x.beginPath(); x.arc(0, -17, 10, 0, 7); x.fill(); x.stroke();
  x.fillStyle = '#ffc93c'; const sp = a ? 30 : 22;
  x.beginPath(); x.arc(-sp, -6 - (a ? 8 : 0), 7, 0, 7); x.fill(); x.stroke(); x.beginPath(); x.arc(sp, -6 - (a ? 8 : 0), 7, 0, 7); x.fill(); x.stroke();
  x.strokeStyle = '#ff7a2f'; x.lineWidth = 6; x.lineCap = 'round'; x.beginPath(); x.moveTo(-12, 0); x.lineTo(-sp, -6 - (a ? 8 : 0)); x.moveTo(12, 0); x.lineTo(sp, -6 - (a ? 8 : 0)); x.stroke();
  x.fillStyle = '#1b1b3a'; x.fillRect(-14, 34, 11, 14); x.fillRect(3, 34, 11, 14);
  x.restore();
  // nishon
  if (P.tx != null && (P.phase === 'meter')) {
    const m = Math.sin((performance.now() - P.t0) / 1000 * 3.1), r = 10 + Math.abs(m) * 14;
    x.strokeStyle = '#25f0b0'; x.lineWidth = 2.5; x.beginPath(); x.arc(P.tx, P.ty, 10, 0, 7); x.stroke();
    x.strokeStyle = 'rgba(37,240,176,.5)'; x.beginPath(); x.arc(P.tx, P.ty, r + 6, 0, 7); x.stroke();
    x.beginPath(); x.moveTo(P.tx - 16, P.ty); x.lineTo(P.tx + 16, P.ty); x.moveTo(P.tx, P.ty - 16); x.lineTo(P.tx, P.ty + 16); x.stroke();
  }
  // to'p
  let bx = 180, by = 372, bs = 1;
  if (a) { const t = a.t, e = 1 - Math.pow(1 - t, 2); bx = 180 + (a.fx - 180) * e; by = 372 + (a.fy - 372) * e - Math.sin(t * Math.PI) * 30; bs = 1 - .62 * e; }
  else if (P.msgT > 0 && P.res.length) { bx = 180; by = 372; }
  x.fillStyle = 'rgba(0,0,0,.3)'; x.beginPath(); x.ellipse(bx, (a ? 372 + (a.fy - 372) * (1 - Math.pow(1 - a.t, 2)) : 372) + 14 * bs, 13 * bs, 5 * bs, 0, 0, 7); x.fill();
  x.fillStyle = '#fff'; x.strokeStyle = '#222'; x.lineWidth = 2; x.beginPath(); x.arc(bx, by, 14 * bs, 0, 7); x.fill(); x.stroke();
  x.fillStyle = '#222'; x.beginPath(); x.arc(bx, by, 5 * bs, 0, 7); x.fill();
  // virilgan to'r
  if (P.net > 0) { x.strokeStyle = `rgba(255,255,255,${P.net})`; x.lineWidth = 2; x.strokeRect(GL + 3, GT + 3, GR - GL - 6, GB - GT - 6); }
  // dastak (ustun, to'sin)
  x.strokeStyle = '#fff'; x.lineWidth = 7; x.lineCap = 'round'; x.beginPath(); x.moveTo(GL, GB); x.lineTo(GL, GT); x.lineTo(GR, GT); x.lineTo(GR, GB); x.stroke();
  // xabar
  if (P.msgT > 0) {
    x.save(); x.globalAlpha = Math.min(1, P.msgT * 2); x.textAlign = 'center'; x.font = '800 64px Barlow Condensed, Arial Narrow, sans-serif';
    x.fillStyle = P.msg === 'GOL!' ? '#ffc93c' : '#ff3d85'; x.strokeStyle = '#000'; x.lineWidth = 6; x.strokeText(P.msg, 180, 290); x.fillText(P.msg, 180, 290); x.restore();
  }
}
})();
